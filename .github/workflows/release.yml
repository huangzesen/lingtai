name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  source-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; preserving it."
          else
            # Draft-first: the release must not become public/latest until
            # windows-release has validated, built, packaged, and uploaded the
            # Windows assets. source-release never publishes; windows-release
            # flips the draft to a public release only after its upload passes.
            gh release create "$TAG" --repo "$REPO" --verify-tag --draft \
              --title "$TAG" --notes "Release $TAG"
          fi

  update-homebrew:
    # Wait for the same publication boundary: this job must only run after
    # windows-release has validated, built, packaged, uploaded, and published
    # the release, so the formula can never advertise a tag whose Windows
    # assets (or whose public release itself) do not yet exist.
    needs: windows-release
    runs-on: ubuntu-latest
    steps:
      - name: Compute source tarball checksum
        id: sha
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::TAG '$TAG' is not an exact vX.Y.Z release tag" >&2
            exit 1
          fi
          url="https://github.com/Lingtai-AI/lingtai/archive/refs/tags/${TAG}.tar.gz"
          # Fail closed: curl -f turns any HTTP error status into a non-zero
          # exit, and pipefail (set above) propagates it through the pipeline,
          # so a checksum of an error response can never reach the formula.
          sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
          echo "source=$sha" >> "$GITHUB_OUTPUT"
          echo "Source tarball SHA256: $sha"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: Lingtai-AI/homebrew-lingtai
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Write formula
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ steps.sha.outputs.source }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # The formula is written in two heredocs on purpose.
          #
          # This first one interpolates the three release values, so its
          # delimiter has to stay unquoted. That is safe here and only here: the
          # header carries no backtick and no $( ), and the shell never re-scans
          # a parameter-expansion result, so neither the tag nor the checksum can
          # turn into a command. The exact-tag gate in the first step of this job
          # additionally keeps ${TAG} away from Ruby's #{} interpolation.
          cat > homebrew-tap/lingtai-tui.rb << FORMULA_HEADER
          class LingtaiTui < Formula
            desc "Terminal UI for the Lingtai AI agent framework"
            homepage "https://github.com/Lingtai-AI/lingtai"
            version "${VERSION}"
            license "Apache-2.0"

            url "https://github.com/Lingtai-AI/lingtai/archive/refs/tags/${TAG}.tar.gz"
            sha256 "${SHA}"
          FORMULA_HEADER

          # The body needs no expansion and must not receive any. It is Ruby that
          # only Homebrew may evaluate, and it contains a backtick pair (`npm ci`
          # in the mirror-selection comment) plus #{version}. With an unquoted
          # delimiter the runner executed that backtick pair itself and published
          # its stdout into the tap. The quoted delimiter copies the body through
          # byte for byte.
          cat >> homebrew-tap/lingtai-tui.rb << 'FORMULA_BODY'

            depends_on "go" => :build
            depends_on "node" => :build
            depends_on "uv" => :recommended
            depends_on "python@3.13" => :recommended

            def install
              # Network mirror selection. Go-module mirrors and the npm registry are
              # configured independently — a Go proxy outage must not force an npm
              # registry switch (and vice versa).
              #
              # Go modules:
              #   1. HOMEBREW_GOPROXY (explicit user override) — community convention,
              #      survives Homebrew's superenv scrub because of the HOMEBREW_ prefix.
              #   2. Auto-detect: probe a stable proxy.golang.org API endpoint with a
              #      3s timeout. If unreachable (typical on mainland China networks),
              #      fall back to CN-accessible mirrors for Go modules and the Go
              #      checksum database (sum.golang.google.cn is Google's own
              #      CN-reachable alias of sum.golang.org, required for CN builds).
              #   3. Otherwise: leave ENV untouched — users elsewhere see no difference.
              #
              # npm registry:
              #   1. HOMEBREW_NPM_CONFIG_REGISTRY (explicit user override) — same
              #      HOMEBREW_ prefix trick so it survives the superenv scrub.
              #   2. Auto-detect ONLY when the Go proxy was unreachable AND an npm
              #      client probe to registry.npmmirror.com succeeds. Use npm (not curl)
              #      so the probe exercises the same Node/npm TLS trust store that
              #      `npm ci` will use; otherwise leave the npm registry on its default.
              #   3. Otherwise: leave ENV untouched.
              if ENV["HOMEBREW_GOPROXY"]
                ENV["GOPROXY"] = ENV["HOMEBREW_GOPROXY"]
                go_proxy_reachable = true
              else
                go_proxy_reachable = quiet_system(
                  "curl", "-sSfL", "--max-time", "3", "-o", "/dev/null",
                  "https://proxy.golang.org/github.com/golang/go/@latest"
                )
                unless go_proxy_reachable
                  opoo "proxy.golang.org unreachable; using China-friendly Go build mirrors."
                  ENV["GOPROXY"] = "https://goproxy.cn,direct"
                  ENV["GOSUMDB"] = "sum.golang.google.cn"
                end
              end

              if ENV["HOMEBREW_NPM_CONFIG_REGISTRY"]
                ENV["NPM_CONFIG_REGISTRY"] = ENV["HOMEBREW_NPM_CONFIG_REGISTRY"]
              elsif !go_proxy_reachable
                npmmirror_reachable = quiet_system(
                  "npm", "ping", "--registry=https://registry.npmmirror.com",
                  "--fetch-timeout=3000", "--fetch-retries=0"
                )
                if npmmirror_reachable
                  opoo "Using China-friendly npm registry (registry.npmmirror.com)."
                  ENV["NPM_CONFIG_REGISTRY"] = "https://registry.npmmirror.com"
                else
                  opoo "registry.npmmirror.com failed npm's connectivity/TLS probe; leaving npm registry unchanged. Set HOMEBREW_NPM_CONFIG_REGISTRY to override."
                end
              end

              cd "tui" do
                ldflags = "-X main.version=#{version}"
                system "go", "build", *std_go_args(ldflags: ldflags), "-o", bin/"lingtai-tui", "."
              end

              cd "portal" do
                cd "web" do
                  system "npm", "ci"
                  system "npm", "run", "build"
                end
                ldflags = "-X main.version=#{version}"
                system "go", "build", *std_go_args(ldflags: ldflags), "-o", bin/"lingtai-portal", "."
              end
            end

            test do
              assert_match "lingtai-tui", shell_output("#{bin}/lingtai-tui version 2>&1", 0)
            end
          end
          FORMULA_BODY

      - name: Push formula update
        working-directory: homebrew-tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lingtai-tui.rb
          git diff --cached --quiet || git commit -m "Update lingtai-tui to $TAG"
          git push

  windows-release:
    needs: source-release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      KERNEL_REPO: Lingtai-AI/lingtai-kernel
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Fail closed unless the pinned kernel release is publishable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Tag must be an exact vX.Y.Z; the version stamped into the binaries
          # and the Homebrew-style bare version must agree with it.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::TAG '$TAG' is not an exact vX.Y.Z release tag" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_ENV"

          # kernel-release.json is the sole source of the paired kernel tag;
          # this job never resolves "latest" kernel.
          if [[ ! -f kernel-release.json ]]; then
            echo "::error::kernel-release.json is missing; cannot bind a Windows bundle to a kernel release" >&2
            exit 1
          fi
          schema="$(python3 -c 'import json,sys; print(json.load(open("kernel-release.json")).get("schema",""))')"
          if [[ "$schema" != "lingtai.tui.kernel-pin/v1" ]]; then
            echo "::error::kernel-release.json has unexpected schema '$schema'" >&2
            exit 1
          fi
          kernel_tag="$(python3 -c 'import json; print(json.load(open("kernel-release.json"))["kernel_tag"])')"
          if [[ ! "$kernel_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::kernel-release.json kernel_tag '$kernel_tag' is not an exact vX.Y.Z tag" >&2
            exit 1
          fi
          echo "kernel_tag=$kernel_tag" >> "$GITHUB_ENV"
          echo "kernel_version=${kernel_tag#v}" >> "$GITHUB_ENV"

          # The pinned kernel release must exist and publish its strict release
          # manifest plus at least one cp311/cp312/cp313 win_amd64 wheel with a
          # digest, or this job fails closed before any build step runs.
          if ! gh release view "$kernel_tag" --repo "$KERNEL_REPO" >/dev/null 2>&1; then
            echo "::error::pinned kernel release $kernel_tag does not exist in $KERNEL_REPO" >&2
            exit 1
          fi
          manifest_url="$(gh release view "$kernel_tag" --repo "$KERNEL_REPO" --json assets \
            --jq '.assets[] | select(.name == "lingtai-kernel-release-manifest.json") | .url')"
          if [[ -z "$manifest_url" ]]; then
            echo "::error::pinned kernel release $kernel_tag has no lingtai-kernel-release-manifest.json asset" >&2
            exit 1
          fi
          curl -fsSL "$manifest_url" -o /tmp/kernel-release-manifest.json
          # The kernel release is independently versioned from the TUI release;
          # validate the manifest against the pinned kernel tag, not TAG.
          python3 - "$kernel_tag" << 'PY'
          import json, re, sys
          kernel_tag = sys.argv[1]
          kernel_version_expected = kernel_tag.lstrip("v")
          data = json.load(open("/tmp/kernel-release-manifest.json"))
          if data.get("schema") != "lingtai.kernel.release/v1":
              sys.exit(f"kernel manifest has unexpected schema {data.get('schema')!r}")
          if data.get("kernel_version") != kernel_version_expected:
              sys.exit(f"kernel manifest kernel_version {data.get('kernel_version')!r} does not match pinned tag {kernel_tag}")
          wheels = [
              a for a in data.get("artifacts", [])
              if a.get("kind") == "wheel"
              and a.get("python_tag") in ("cp311", "cp312", "cp313")
              and a.get("platform_tag") == "win_amd64"
              and re.fullmatch(r"[0-9a-f]{64}", a.get("sha256", ""))
          ]
          if not wheels:
              sys.exit(f"kernel release {kernel_tag} publishes no cp311/cp312/cp313 win_amd64 wheel with a sha256 digest")
          print(f"OK: kernel release {kernel_tag} publishes {len(wheels)} compatible win_amd64 wheel(s)")
          PY

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Build lingtai-tui.exe (windows/amd64)
        working-directory: tui
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -ldflags "-X main.version=$TAG" \
            -o "$GITHUB_WORKSPACE/dist/lingtai-tui.exe" .

      - name: Build lingtai-portal.exe (windows/amd64)
        working-directory: portal
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -ldflags "-X main.version=$TAG" \
            -o "$GITHUB_WORKSPACE/dist/lingtai-portal.exe" .

      - name: Package Windows archive
        run: |
          set -euo pipefail
          test -f dist/lingtai-tui.exe
          test -f dist/lingtai-portal.exe

          zip_name="lingtai-${TAG}-windows-amd64.zip"
          ( cd dist && zip -X "../$zip_name" lingtai-tui.exe lingtai-portal.exe )
          sha256sum "$zip_name" > "$zip_name.sha256"
          echo "zip_name=$zip_name" >> "$GITHUB_ENV"

      - name: Generate bundle manifest
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          archive_sha="$(cut -d' ' -f1 "$zip_name.sha256")"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$TAG" "$commit" "$generated_at" "$kernel_tag" "$kernel_version" "$zip_name" "$archive_sha" << 'PY'
          import json, sys
          tag, commit, generated_at, kernel_tag, kernel_version, zip_name, archive_sha = sys.argv[1:]
          manifest = {
              "schema": "lingtai.tui.bundle/v1",
              "bundle_id": tag,
              "tui_tag": tag,
              "tui_commit": commit,
              "generated_at": generated_at,
              "kernel_tag": kernel_tag,
              "kernel_version": kernel_version,
              "kernel_manifest_filename": "lingtai-kernel-release-manifest.json",
              "archives": [
                  {"filename": zip_name, "sha256": archive_sha},
              ],
              "providers": {
                  "github": {"repo": "Lingtai-AI/lingtai"},
                  "gitee": {"owner": "huangzesen1997", "repo": "lingtai"},
              },
          }
          with open("lingtai-bundle-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2, sort_keys=False)
              f.write("\n")
          PY

      - name: Upload Windows release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$REPO" --clobber \
            "$zip_name" "$zip_name.sha256" lingtai-bundle-manifest.json

      - name: Publish GitHub release after Windows assets verified and uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The source release was created as a draft; it only becomes
          # public/latest here, after every kernel/validation/build/package/
          # manifest/upload gate in this job has passed. Any earlier failure
          # leaves the draft unpublished (never a partially public release).
          names="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          for asset in "$zip_name" "$zip_name.sha256" lingtai-bundle-manifest.json; do
            if ! grep -qx "$asset" <<< "$names"; then
              echo "::error::release $TAG is missing required Windows asset $asset" >&2
              exit 1
            fi
          done
          gh release edit "$TAG" --repo "$REPO" --draft=false

      - name: Notify lingtai-web download mirror
        # Only after the release above is actually public -- never before
        # publication, and never on a run that failed any earlier gate in
        # this job. This is a download-acceleration mirror, not an alternate
        # release-publication path: a missing/failed dispatch never edits or
        # undoes the GitHub release published above. continue-on-error
        # isolates a dispatch failure (e.g. an expired/under-scoped
        # LINGTAI_WEB_DISPATCH_TOKEN, or a transient API error) from this
        # job's overall result: update-homebrew `needs: windows-release` and
        # would otherwise be skipped by a download-acceleration outage even
        # though the GitHub release and Homebrew's own prerequisites are
        # already fully published. Every real publication/upload gate above
        # stays fail-closed; only this best-effort notification is isolated.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.LINGTAI_WEB_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::LINGTAI_WEB_DISPATCH_TOKEN is not set; skipping the lingtai.ai download-mirror dispatch. This is a documented deployment prerequisite (a token with repository_dispatch write access on Lingtai-AI/lingtai-web), not a release failure -- the GitHub release above already succeeded."
            exit 0
          fi
          python3 - "$TAG" "$zip_name" << 'PY' | gh api repos/Lingtai-AI/lingtai-web/dispatches --method POST --input -
          import hashlib
          import json
          import sys
          from pathlib import Path

          tag, zip_name = sys.argv[1], sys.argv[2]

          def sha256_of(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          # These are exactly the three assets "Upload Windows release
          # assets" uploaded and "Publish GitHub release ..." just verified
          # are attached; sha256 is recomputed fresh from the same
          # still-on-disk bytes, never trusted from an earlier step's output.
          assets = []
          for name in (zip_name, f"{zip_name}.sha256", "lingtai-bundle-manifest.json"):
              path = Path(name)
              assets.append({
                  "name": name,
                  "sha256": sha256_of(path),
                  "size": path.stat().st_size,
              })

          print(json.dumps({
              "event_type": "release-asset-published",
              "client_payload": {
                  "source_repo": "Lingtai-AI/lingtai",
                  "tag": tag,
                  "assets": assets,
              },
          }))
          PY
